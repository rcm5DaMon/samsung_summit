name: Refresh data

# Manual refresh: Actions tab -> "Refresh data" -> "Run workflow" (one BigQuery query, ~0.2 GB scan).
# A push to main (e.g. you edit dashboard.html or sql/import.sql) only redeploys the site, no query.
# Automatic refresh every day at 12:15, 14:15, 16:15 and 17:45 WIB (schedule below).
# Cron is in UTC, WIB = UTC+7: 05:15 UTC = 12:15 WIB, 07:15 UTC = 14:15 WIB, 09:15 UTC = 16:15 WIB, 10:45 UTC = 17:45 WIB.
# GitHub may start a scheduled run a few minutes late when it is busy.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "15 5 * * *"    # 12:15 WIB
    - cron: "15 7 * * *"    # 14:15 WIB
    - cron: "15 9 * * *"    # 16:15 WIB
    - cron: "45 10 * * *"   # 17:45 WIB

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install --quiet google-cloud-bigquery

      - name: Run import query
        run: python scripts/refresh.py

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No change in data."
          else
            git commit -m "Refresh data $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"
            git push
          fi

  deploy:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      # one page per target (summit / aseries / racing / pesta) from dashboard.html + the index menu + data
      - name: Build site
        run: python3 scripts/build_pages.py _site
      - uses: actions/configure-pages@v6
      # one artifact name per attempt, so "Re-run failed jobs" can't leave two artifacts with the same name
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      # GitHub sometimes can't find an artifact for a few seconds right after it is uploaded
      # ("No artifacts named github-pages were found"). Wait a little, and if publishing still fails, wait and try once more.
      - name: Wait for the artifact to be ready
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
